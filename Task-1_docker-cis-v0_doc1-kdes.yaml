chain-of-thought: "element1:\n  name: Host Configuration\n  requirements:\n    - Ensure\
  \ a separate partition for containers has been created (Manual)\n    - Ensure only\
  \ trusted users are allowed to control Docker daemon (Manual)\n    - Ensure auditing\
  \ is configured for the Docker daemon (Automated)\n    - Ensure auditing is configured\
  \ for Docker files and directories - /run/containerd (Automated)\n    - Ensure auditing\
  \ is configured for Docker files and directories - /var/lib/docker (Manual)\n  \
  \  - Ensure auditing is configured for Docker files and directories - /etc/docker\
  \ (Automated)\n    - Ensure auditing is configured for Docker files and directories\
  \ - docker.service (Automated)\n    - Ensure auditing is configured for Docker files\
  \ and directories - containerd.sock (Automated)\n    - Ensure auditing is configured\
  \ for Docker files and directories - docker.socket (Automated)\n    - Ensure auditing\
  \ is configured for Docker files and directories - /etc/default/docker (Automated)\n\
  \    - Ensure auditing is configured for Docker files and directories - /etc/docker/daemon.json\
  \ (Automated)\n    - Ensure auditing is configured for Docker files and directories\
  \ - /etc/containerd/config.toml (Automated)\n    - Ensure auditing is configured\
  \ for Docker files and directories - /etc/sysconfig/docker (Automated)\n    - Ensure\
  \ auditing is configured for Docker files and directories - /usr/bin/containerd\
  \ (Automated)\n    - Ensure auditing is configured for Docker files and directories\
  \ - /usr/bin/containerd-shim (Manual)\n    - Ensure auditing is configured for Docker\
  \ files and directories - /usr/bin/containerd-shim-runc-v1 (Manual)\n    - Ensure\
  \ auditing is configured for Docker files and directories - /usr/bin/containerd-shim-runc-v2\
  \ (Manual)\n    - Ensure auditing is configured for Docker files and directories\
  \ - /usr/bin/unstable (Manual)\n1.2 General Configuration\n1.2.1 Ensure the container\
  \ host has been Hardened (Manual)\n1.2.2 Ensure that the version of Docker is up\
  \ to date (Manual)\n2 Docker daemon configuration\n2.1 Run the Docker daemon as\
  \ a non-root user, if possible (Manual)\n2.2 Ensure network traffic is restricted\
  \ between containers on the default bridge (Manual)\n2.3 Ensure the logging level\
  \ is set to 'info' (Manual)\n2.4 Ensure Docker is allowed to make changes to iptables\
  \ (Manual)\n2.5 Ensure insecure registries are not used (Manual)\n2.6 Ensure that\
  \ aufs storage driver is not used (Manual)\n2.7 Ensure TLS authentication for Docker\
  \ daemon is configured (Manual)\n2.8 Ensure the default ulimit is configured appropriately\
  \ (Manual)\n2.9 Enable user namespace support (Manual)\n2.10 Ensure the default\
  \ cgroup usage has been confirmed (Manual)\n2.11 Ensure that base device size is\
  \ not changed until needed (Manual)\n2.12 Ensure that authorization for Docker client\
  \ commands is enabled (Manual)\n2.13 Ensure centralized and remote logging is configured\
  \ (Manual)\n2.14 Ensure containers are restricted from acquiring new privileges\
  \ (Manual)\n2.15 Ensure live restore is enabled (Manual)\n2.16 Ensure Userland Proxy\
  \ is Disabled (Manual)\n2.17 Ensure that a daemon-wide custom seccomp profile is\
  \ applied if appropriate (Manual)\n2.18 Ensure that experimental features are not\
  \ implemented in production (Manual)\n3 Docker daemon configuration files\n3.1 Ensure\
  \ that the docker.service file ownership is set to root:root (Automated)\n3.2 Ensure\
  \ that docker.service file permissions are properly set (Automated)\n3.3 Ensure\
  \ that docker.socket file ownership is set to root:root (Automated)\n3.4 Ensure\
  \ that docker.socket file permissions are set to 644 or more restrictive (Automated)\n\
  3.5 Ensure that the /etc/docker directory ownership is set to root:root (Automated)\n\
  3.6 Ensure that /etc/docker directory permissions are set to 755 or more restrictively\
  \ (Automated)"
